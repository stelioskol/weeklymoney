<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.png?v=1">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="manifest" href="manifest.json">
<title>Έξοδα</title>
<style>
:root{--bg:#f6f1ff;--ink:#261c3d;--mute:#7d7399;--card:#fff;--line:#ece5f8;--ok:#10b981;--bad:#ef4444;--sh:0 10px 28px rgba(90,55,150,.16);--g1:hsl(285 95% 86% / .55);--g2:hsl(190 90% 82% / .45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f22;--ink:#f5f0ff;--mute:#ab9fc9;--card:#231a36;--line:#34294b;--sh:0 10px 28px rgba(0,0,0,.55);--g1:hsl(285 80% 40% / .35);--g2:hsl(200 80% 35% / .3)}}
:root[data-theme="dark"]{--bg:#150f22;--ink:#f5f0ff;--mute:#ab9fc9;--card:#231a36;--line:#34294b;--sh:0 10px 28px rgba(0,0,0,.55);--g1:hsl(285 80% 40% / .35);--g2:hsl(200 80% 35% / .3)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 5% -10%,var(--g1),transparent 45%),radial-gradient(circle at 105% 0,var(--g2),transparent 40%),var(--bg);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
header{padding:12px 16px 8px}
.r1{display:flex;align-items:center;gap:8px}.tt{flex:1;text-align:center}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px}
#st{margin:1px 0 0;color:var(--mute);font-size:13px;font-weight:600}
.nv{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--card);color:var(--ink);font-size:26px;padding:0 0 3px;box-shadow:var(--sh)}
.r2{display:flex;gap:8px;margin-top:10px}
.seg{flex:1;display:flex;background:var(--line);border-radius:16px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font-size:14px;font-weight:700;padding:8px 0;border-radius:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(80,50,140,.15)}
#td{border:0;border-radius:16px;padding:0 14px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(140deg,#8b5cf6,#ec4899)}
#main{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 28px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
.card{background:var(--card);border-radius:26px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 78% 50%),hsl(calc(var(--h) + 35) 85% 58%))}
h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.4px}
.hd small{font-size:13px;font-weight:600;opacity:.92}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.gear{border:0;background:rgba(255,255,255,.25);border-radius:12px;padding:6px 10px;font-size:18px}
.lm{padding:10px 18px 0;font-size:14px;font-weight:700}
.g{color:var(--ok)}.r{color:var(--bad)}
.list{list-style:none;margin:0;padding:6px 12px}
li{display:flex;align-items:center;gap:10px;padding:10px 3px;border-bottom:1px dashed var(--line)}
li.empty{display:block;border:0;text-align:center;color:var(--mute);padding:28px 10px;font-weight:600;line-height:1.6}
.em{font-size:23px}
.tx{flex:1;font-size:16px;font-weight:700;line-height:1.25;word-break:break-word}
.tx small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:18px;font-weight:800;padding:0}
.stp b{min-width:18px;text-align:center}
.pr{min-width:62px;text-align:right;font-weight:800;font-size:15px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:4px 12px 0;padding:12px 14px;border-radius:16px;background:var(--line);font-weight:800;font-size:17px}
.sub{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px;font-weight:800;font-size:15px}
.sub button{border:0;background:var(--line);color:var(--ink);border-radius:12px;padding:5px 10px;font-weight:700}
.ch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 12px 10px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:9px 4px;font-size:13px;font-weight:700}
.chip i{font-style:normal;font-size:24px}.chip u{text-decoration:none;color:var(--mute);font-size:12px}
.chip:active{transform:scale(.94)}
.chip em{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#ec4899;color:#fff;font-style:normal;font-size:12px;line-height:22px;text-align:center}
.chip s{position:absolute;top:-6px;left:-4px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;text-decoration:none;font-size:11px;line-height:22px}
.add{display:flex;gap:8px;padding:6px 12px 14px}
input{font-size:16px;font-weight:600;font-family:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:0;min-width:0}
input:focus{border-color:#8b5cf6}
.add #nn{flex:1}.add #np{width:78px}
.plus{flex:none;width:46px;border:0;border-radius:14px;color:#fff;font-size:26px;font-weight:700;padding:0;background:linear-gradient(140deg,#8b5cf6,#ec4899)}
.sg{display:flex;gap:8px;padding:14px 14px 4px}
.sg div{flex:1;background:var(--bg);border-radius:14px;padding:9px 6px;text-align:center}
.sg u{display:block;text-decoration:none;font-size:11px;color:var(--mute);font-weight:700}
.sg b{font-size:16px}
.pb{height:8px;margin:10px 18px 0;border-radius:8px;background:var(--line);overflow:hidden}
.pb u{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border-radius:8px}
.nt{padding:8px 18px;font-size:13px;color:var(--mute);font-weight:600}
.vd{margin:6px 14px 14px;padding:10px 12px;border-radius:14px;background:var(--bg);font-weight:700;font-size:14px}
.set{display:flex;flex-direction:column;gap:8px;padding:4px 14px 14px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mute)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.mg b{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.cell{border:2px solid transparent;border-radius:14px;background:var(--card);color:var(--ink);min-height:60px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(80,50,140,.1)}
.cell i{font-style:normal;font-size:13px;font-weight:800}.cell span{font-size:12px;font-weight:800}
.cell.off{opacity:.4}.cell.now{border-color:#8b5cf6}
.cell.ok{background:hsl(160 70% 45% / .2)}.cell.bad{background:hsl(0 80% 60% / .22)}
</style>
</head>
<body>
<header>
<div class="r1"><button class="nv" id="pv" aria-label="Πίσω">‹</button><div class="tt"><h1 id="tt"></h1><p id="st"></p></div><button class="nv" id="nx" aria-label="Μπροστά">›</button></div>
<div class="r2"><div class="seg"><button data-v="d">Μέρα</button><button data-v="m">Μήνας</button></div><button id="td">Σήμερα</button></div>
</header>
<main id="main"></main>
<script>
const WD=[{n:'Δευτέρα',h:262},{n:'Τρίτη',h:330},{n:'Τετάρτη',h:200},{n:'Πέμπτη',h:150},{n:'Παρασκευή',h:22},{n:'Σάββατο',h:290},{n:'Κυριακή',h:42}];
const WS=['Δ','Τ','Τ','Π','Π','Σ','Κ'];
const MN=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const MS=['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const MAP=[['καφ','☕'],['φαγ|σουβλ|γευμ|μεσημ','🍝'],['super|σουπερ|ψων','🛒'],['βενζιν|καυσιμ','⛽'],['μπυρ|ποτο|μπαρ','🍺'],['delivery|διανομ','🛵'],['εισιτ|λεωφ|ταξι','🚌'],['τσιγ','🚬'],['γυμν','💪']];
const DEF=[['Καφές','☕',2.5],['Φαγητό','🍝',8],['Σουβλάκι','🌯',4],['Snack','🥐',2],['Super market','🛒',20],['Βενζίνη','⛽',30],['Ποτό','🍺',5],['Delivery','🛵',12],['Εισιτήριο','🚌',1.2]].map((x,i)=>({id:'c'+i,n:x[0],e:x[1],p:x[2]}));
const pad=n=>String(n).padStart(2,'0'),K=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-');return new Date(+y,m-1,+d)};
const wd=d=>(d.getDay()+6)%7,addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},mon=d=>addD(d,-wd(d));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ');
const eur=n=>n.toLocaleString('el-GR',{style:'currency',currency:'EUR'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const num=v=>parseFloat(String(v).replace(',','.'));
function emo(t){const m=t.match(/^\p{Extended_Pictographic}\uFE0F?/u);if(m)return[m[0],t.slice(m[0].length).trim()||t];const n=norm(t);for(const[k,e]of MAP)if(new RegExp(k).test(n))return[e,t];return['🧾',t]}
const now=new Date();now.setHours(0,0,0,0);
let S={cat:DEF,inc:0,goal:0,x:{}};try{Object.assign(S,JSON.parse(localStorage.getItem('expenses-v1'))||{})}catch(e){}
const save=()=>{try{localStorage.setItem('expenses-v1',JSON.stringify(S))}catch(e){}};
const main=document.getElementById('main');
let V='d',cur=new Date(now),E=false,SET=false;
const tot=k=>(S.x[k]||[]).reduce((s,e)=>s+e.p*e.q,0);
const dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const dayBud=d=>S.inc?Math.max(0,S.inc-S.goal)/dim(d):0;
function mstat(d){const n=dim(d),y=d.getFullYear(),m=d.getMonth();let e=0;for(let i=1;i<=n;i++)e+=tot(K(new Date(y,m,i)));
  const cm=y==now.getFullYear()&&m==now.getMonth(),el=cm?now.getDate():new Date(y,m,1)<now?n:0;
  return{e,el,inc:S.inc,goal:S.goal,proj:el?(el==n?e:e/el*n):0}}
const li=x=>`<li data-id="${x.id}"><span class="em">${x.e}</span><span class="tx">${esc(x.n)}<small>${eur(x.p)}</small></span><div class="stp"><button data-a="dn" aria-label="Λιγότερο">−</button><b>${x.q}</b><button data-a="up" aria-label="Περισσότερο">+</button></div><span class="pr">${eur(x.p*x.q)}</span></li>`;
function day(){const k=K(cur),a=S.x[k]||[],t=tot(k),w=WD[wd(cur)],B=dayBud(cur);let lim='';
  if(B){const l=B-t;lim=`<div class="lm ${l<0?'r':'g'}">${l<0?'Ξεπέρασες το όριο κατά '+eur(-l):'Όριο ημέρας '+eur(B)+' · έμειναν '+eur(l)}</div>`}
  const chips=S.cat.map(c=>{const x=a.find(y=>y.i==c.id);return`<button class="chip" data-a="ch" data-id="${c.id}"><i>${c.e}</i><span>${esc(c.n)}</span><u>${eur(c.p)}</u>${x&&!E?`<em>${x.q}</em>`:''}${E?`<s data-a="rc" data-id="${c.id}">✕</s>`:''}</button>`}).join('');
  return`<section class="card" style="--h:${w.h}"><div class="hd"><div><h2>${w.n}</h2><small>${cur.getDate()} ${MS[cur.getMonth()]}${K(cur)==K(now)?' · σήμερα':''}</small></div><div class="big">${eur(t)}</div></div>${lim}<ul class="list">${a.map(li).join('')||'<li class="empty">Κανένα έξοδο ακόμα 🎉<br>Διάλεξε μια επιλογή παρακάτω</li>'}</ul><div class="tot"><span>Σύνολο ημέρας</span><span>${eur(t)}</span></div><div class="sub"><span>Πρόσθεσε έξοδο</span><button data-a="ed">${E?'Τέλος':'✏️ Επεξεργασία'}</button></div>${E?'<div class="nt">Πάτα μια επιλογή για να αλλάξεις την τιμή ή το ✕ για διαγραφή.</div>':''}<div class="ch">${chips}</div><div class="add"><input id="nn" maxlength="30" placeholder="Νέα επιλογή" autocomplete="off"><input id="np" inputmode="decimal" placeholder="€" autocomplete="off"><button class="plus" data-a="add" aria-label="Προσθήκη">+</button></div></section>`}
function stats(){const s=mstat(cur),bud=Math.max(0,s.inc-s.goal),p=bud?Math.min(100,s.e/bud*100):0,left=s.inc-s.e,sv=s.inc-s.proj,ok=sv>=s.goal;
  let h=`<section class="card" style="--h:262"><div class="hd"><div><h2>${MN[cur.getMonth()]}</h2><small>Σύνολο μήνα</small></div><button class="gear" data-a="set" aria-label="Ρυθμίσεις">⚙️</button></div><div class="sg"><div><u>Έξοδα</u><b>${eur(s.e)}</b></div>${s.inc?`<div><u>Έμειναν</u><b class="${left<0?'r':'g'}">${eur(left)}</b></div>`:''}${s.inc&&s.el?`<div><u>Αποταμίευση</u><b class="${ok?'g':'r'}">${eur(sv)}</b></div>`:''}</div>`;
  if(bud)h+=`<div class="pb"><u style="width:${p}%;${s.e>bud?'background:var(--bad)':''}"></u></div><div class="nt">Διαθέσιμα για έξοδα: ${eur(bud)} (εισόδημα − στόχος)</div>`;
  if(s.inc&&s.el)h+=`<div class="vd ${ok?'g':'r'}">${ok?'✅ Με αυτό τον ρυθμό πιάνεις τον στόχο':'⚠️ Με αυτό τον ρυθμό λείπουν '+eur(s.goal-sv)+' από τον στόχο'}</div>`;
  if(!s.inc)h+='<div class="nt">Πάτα ⚙️ και βάλε το μηνιαίο εισόδημα, για να δεις αν βγαίνει αποταμίευση.</div>';
  if(SET)h+=`<div class="set"><label>Μηνιαίο εισόδημα (€)<input id="inc" inputmode="decimal" value="${S.inc||''}"></label><label>Στόχος αποταμίευσης (€ τον μήνα)<input id="goal" inputmode="decimal" value="${S.goal||''}"></label></div>`;
  return h+'</section>'}
function month(){const s=mon(new Date(cur.getFullYear(),cur.getMonth(),1)),B=dayBud(cur);let h='<div class="mg">'+WS.map(x=>`<b>${x}</b>`).join('');
  for(let i=0;i<42;i++){const d=addD(s,i);if(i>=35&&i%7==0&&d.getMonth()!=cur.getMonth())break;const k=K(d),t=tot(k);
    h+=`<button class="cell${d.getMonth()!=cur.getMonth()?' off':''}${k==K(now)?' now':''}${t&&B?(t>B?' bad':' ok'):''}" data-a="open" data-k="${k}"><i>${d.getDate()}</i><span>${t?Math.round(t)+'€':''}</span></button>`}
  return h+'</div>'}
function render(reset){const sc=main.scrollTop;
  main.innerHTML=V=='d'?day()+stats():stats()+month();
  main.scrollTop=reset?0:sc;
  document.getElementById('tt').textContent=V=='d'?WD[wd(cur)].n:MN[cur.getMonth()];
  const s=mstat(cur);
  document.getElementById('st').textContent=(V=='d'?`${cur.getDate()} ${MN[cur.getMonth()]} ${cur.getFullYear()}`:cur.getFullYear())+(s.e?` · ${eur(s.e)} τον μήνα`:'');
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
function nav(n){if(V=='d')cur=addD(cur,n);else{const d=new Date(cur.getFullYear(),cur.getMonth()+n,1);cur=d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()?new Date(now):d}render(1)}
function addNew(){const n=document.getElementById('nn').value.trim(),p=num(document.getElementById('np').value);if(!n||!(p>=0))return;
  const[e,t]=emo(n),c={id:uid(),n:t,e,p};S.cat.push(c);(S.x[K(cur)]=S.x[K(cur)]||[]).push({id:uid(),i:c.id,n:t,e,p,q:1});save();render()}
main.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=K(cur),arr=S.x[k]=S.x[k]||[];
  if(a=='open'){cur=parse(b.dataset.k);V='d';return render(1)}
  if(a=='set'){SET=!SET;return render()}
  if(a=='ed'){E=!E;return render()}
  if(a=='add')return addNew();
  if(a=='rc'){if(confirm('Διαγραφή αυτής της επιλογής από τη λίστα; (τα έξοδα που έχεις ήδη γράψει μένουν)'))S.cat=S.cat.filter(x=>x.id!=b.dataset.id)}
  else if(a=='ch'){const c=S.cat.find(x=>x.id==b.dataset.id);
    if(E){const v=num(prompt('Νέα τιμή για: '+c.n,c.p)||'');if(v>=0)c.p=v}
    else{const x=arr.find(y=>y.i==c.id&&y.p==c.p);x?x.q++:arr.push({id:uid(),i:c.id,n:c.n,e:c.e,p:c.p,q:1})}}
  else{const id=b.closest('li').dataset.id,i=arr.findIndex(x=>x.id==id);
    if(a=='up')arr[i].q++;else if(--arr[i].q<=0)arr.splice(i,1)}
  save();render()});
main.addEventListener('change',e=>{if(e.target.id=='inc'){S.inc=num(e.target.value)||0;save();render()}if(e.target.id=='goal'){S.goal=num(e.target.value)||0;save();render()}});
main.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='nn'||e.target.id=='np'))addNew()});
document.getElementById('pv').onclick=()=>nav(-1);
document.getElementById('nx').onclick=()=>nav(1);
document.getElementById('td').onclick=()=>{cur=new Date(now);render(1)};
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v!=V){V=b.dataset.v;render(1)}};
render(1);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
